telegram.bot.token=x
telegram.bot.username=x

spring.application.name=businesscardbot
spring.datasource.url=jdbc:mysql://localhost:3306/businesscardbot
spring.datasource.username=root
spring.datasource.password=3101
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.properties.hibernate.transaction.jta.platform=org.hibernate.engine.transaction.jta.platform.internal.NoJtaPlatform
spring.transaction.default-timeout=30

spring.main.allow-circular-references=true

spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:schema.sql

logging.level.com.bot.businesscardbot=DEBUG
logging.level.org.telegram=DEBUG

logging.level.org.springframework.aop=ERROR

logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE